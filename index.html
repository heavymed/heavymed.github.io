<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeavyMed Apps</title>
  <style>
    :root {
      --neon:       #26d97f;
      --bg-0:       #06080f;
      --bg-1:       #0c1018;
      --bg-2:       #111827;
      --border:     #1a2a20;
      --text:       #e4f5ec;
      --text-muted: #6b9a7e;
      --c-orange:   #ff6a00;
      --c-blue:     #4dabff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1000px 500px at 50% -5%, rgba(255,255,255,.09), transparent 60%),
        var(--bg-0);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      line-height: 1.6;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 3rem;
      padding-top: 1rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -.03em;
      color: var(--text);
      text-shadow: 0 0 16px rgba(255,255,255,.12);
      margin-bottom: .5rem;
    }

    header h1 .accent {
      color: #8b5cf6;
      text-shadow: 0 0 16px rgba(139,92,246,.4);
    }

    header p {
      color: #9a9aac;
      font-size: .95rem;
    }

    /* ── Grid ── */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.1rem;
    }

    /* ── Cards ── */
    .app-card {
      display: block;
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      transition: transform .15s, box-shadow .15s, border-color .15s;
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }

    .app-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      opacity: 0;
      transition: opacity .2s;
    }

    .app-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
    }

    /* barre colorée en haut de chaque carte */
    .app-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 14px 14px 0 0;
      transition: height .15s;
    }
    .app-card:hover::after { height: 4px; }

    /* orange — investissement */
    .app-card.orange { border-color: rgba(255,106,0,.35); }
    .app-card.orange:hover { border-color: rgba(255,106,0,.5); box-shadow: 0 8px 32px rgba(255,106,0,.12); }
    .app-card.orange::after { background: var(--c-orange); box-shadow: 0 0 12px var(--c-orange); }
    .app-card.orange .card-icon { background: rgba(255,106,0,.12); color: var(--c-orange); }
    .app-card.orange .category { color: var(--c-orange); }
    .app-card.orange h2 { text-shadow: 0 0 16px rgba(255,255,255,.12); }

    /* bleu — USIP */
    .app-card.blue { border-color: rgba(77,171,255,.35); }
    .app-card.blue:hover { border-color: rgba(77,171,255,.5); box-shadow: 0 8px 32px rgba(77,171,255,.12); }
    .app-card.blue::after { background: var(--c-blue); box-shadow: 0 0 12px var(--c-blue); }
    .app-card.blue .card-icon { background: rgba(77,171,255,.12); color: var(--c-blue); }
    .app-card.blue .category { color: var(--c-blue); }
    .app-card.blue h2 { text-shadow: 0 0 16px rgba(255,255,255,.12); }

    /* contenu carte */
    .card-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px; height: 40px;
      border-radius: 10px;
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }

    .category {
      display: block;
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: .4rem;
    }

    .app-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: .4rem;
      letter-spacing: -.01em;
    }

    .app-card p {
      color: #9a9aac;
      font-size: .875rem;
      line-height: 1.5;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      margin-top: 3rem;
      color: #9a9aac;
      font-size: .8rem;
    }

    /* ── Responsive ── */
    @media (max-width: 500px) {
      body { padding: 1rem; }
      header h1 { font-size: 1.6rem; }
      header { margin-bottom: 2rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <h1>Heavy<span class="accent">Med</span> Apps</h1>
      <p>Outils cliniques et financiers</p>
    </header>

    <main class="apps-grid">

      <a href="simulateur-financier/index.html" class="app-card orange">
        <div class="card-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
            <polyline points="17 6 23 6 23 12"/>
          </svg>
        </div>
        <span class="category">Financier</span>
        <h2>Simulateur d'investissement</h2>
        <p>Projection à intérêts composés, multi-scénarios, histogramme des intérêts annuels</p>
      </a>

      <a href="usip-simulateur/index.html" class="app-card blue">
        <div class="card-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </div>
        <span class="category">Activité médicale</span>
        <h2>Simulateur USIP</h2>
        <p>Projection de chiffre d'affaires CCAM pour une unité de soins intensifs polyvalents</p>
      </a>

      <!--
        Nouvelle appli : copier un bloc <a class="app-card couleur">…</a>
        et choisir la classe de couleur (orange, blue, ou ajouter la vôtre).
      -->

    </main>

    <footer>
      <p>&copy; 2026</p>
    </footer>

  </div>
</body>
</html>
