<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedPulse — Veille médicale</title>
  <style>
    :root {
      --accent:     #ff4d6d;
      --bg-0:       #06080f;
      --bg-1:       #0c1018;
      --bg-2:       #111827;
      --border:     #1c2230;
      --text:       #e4f5ec;
      --text-muted: #8a93a6;
      --gold:       #ffd166;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1000px 500px at 50% -5vh, rgba(255,77,109,.10), transparent 60%),
        var(--bg-0);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem;
      line-height: 1.6;
    }
    .container { max-width: 1100px; margin: 0 auto; }

    .back-link {
      display: inline-block; margin-bottom: 1.25rem;
      color: var(--accent); opacity: .85; text-decoration: none; font-size: .9rem;
    }
    .back-link:hover { opacity: 1; text-shadow: 0 0 8px var(--accent); }

    /* ── Header ── */
    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
    .brand { display: flex; align-items: center; gap: .7rem; }
    .brand .pulse {
      width: 38px; height: 38px; border-radius: 10px;
      background: rgba(255,77,109,.12); color: var(--accent);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .brand h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
    .brand h1 .accent { color: var(--accent); text-shadow: 0 0 10px rgba(255,77,109,.2); }
    .brand p { font-size: .8rem; color: var(--text-muted); }

    /* ── Custom dropdown spécialité ── */
    .cs-wrap { position: relative; user-select: none; }
    .cs-trigger {
      display: flex; align-items: center; gap: .6rem;
      background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
      color: var(--text); font-weight: 600; font-size: .9rem;
      border: 1px solid var(--border); border-radius: 11px;
      padding: .6rem 1rem .6rem .85rem; cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .cs-trigger:hover { border-color: rgba(255,77,109,.5); }
    .cs-wrap.open .cs-trigger {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,77,109,.15);
      border-radius: 11px 11px 0 0;
    }
    .cs-ico { color: var(--accent); display: flex; }
    .cs-chev { color: var(--text-muted); display: flex; margin-left: .25rem; transition: transform .2s; }
    .cs-wrap.open .cs-chev { transform: rotate(180deg); }
    .cs-list {
      display: none; position: absolute; right: 0; top: 100%;
      min-width: 100%; margin: 0; padding: .35rem;
      background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
      border: 1px solid var(--accent); border-top: none;
      border-radius: 0 0 11px 11px;
      box-shadow: 0 10px 28px rgba(0,0,0,.55);
      list-style: none; z-index: 200;
    }
    .cs-wrap.open .cs-list { display: block; }
    .cs-list li {
      padding: .6rem .85rem; border-radius: 8px; cursor: pointer;
      font-size: .9rem; font-weight: 600; color: var(--text-muted);
      white-space: nowrap; transition: background .1s, color .1s;
    }
    .cs-list li:hover { background: rgba(255,77,109,.1); color: var(--text); }
    .cs-list li.active { color: var(--accent); }

    /* ── Tabs ── */
    .tabs { display: flex; gap: .5rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
    .tab {
      background: none; border: none; color: var(--text-muted);
      padding: .7rem 1.1rem; font-size: .95rem; font-weight: 600; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Layout ── */
    .layout { display: grid; grid-template-columns: 220px 1fr; gap: 1.5rem; align-items: start; }

    .sidebar {
      background: var(--bg-1); border: 1px solid var(--border);
      border-radius: 14px; padding: .6rem; position: sticky; top: 1rem;
    }
    .sidebar button {
      display: flex; width: 100%; justify-content: space-between; align-items: center;
      background: none; border: none; color: var(--text-muted);
      padding: .6rem .75rem; border-radius: 9px; font-size: .9rem; cursor: pointer; text-align: left;
    }
    .sidebar button:hover { background: var(--bg-2); color: var(--text); }
    .sidebar button.active { background: rgba(255,77,109,.12); color: var(--accent); font-weight: 600; }
    .sidebar .count { font-size: .72rem; color: var(--text-muted); background: var(--bg-2); padding: .05rem .45rem; border-radius: 20px; }
    .sidebar button.active .count { color: var(--accent); }

    /* ── Cards ── */
    .feed { display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: var(--bg-1); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.25rem 3rem 1.25rem 1.4rem; position: relative;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { transform: translateY(-2px); }
    .card.marquant { border-color: rgba(255,209,102,.4); }
    .card .flag {
      position: absolute; top: -11px; left: 16px;
      display: inline-flex; align-items: center; gap: .3rem;
      background: var(--gold); color: #1a1300; font-size: .68rem; font-weight: 800;
      padding: .18rem .6rem; border-radius: 20px; letter-spacing: .03em;
    }
    .card .flag svg { display: block; }
    .card-meta { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .55rem; }
    .badge {
      font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      padding: .2rem .55rem; border-radius: 6px; background: var(--bg-2); color: var(--text-muted);
    }
    .badge.type { background: rgba(255,77,109,.12); color: var(--accent); }
    .badge.date { background: transparent; color: var(--text-muted); padding-left: 0; }
    .card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: .45rem; letter-spacing: -.01em; }
    .card p { font-size: .9rem; color: #c5cdd9; margin-bottom: .8rem; }
    .card .src {
      display: inline-flex; align-items: center; gap: .35rem;
      color: var(--accent); text-decoration: none; font-size: .85rem; font-weight: 600;
    }
    .card .src:hover { text-decoration: underline; }

    /* ── Bouton favori ── */
    .fav-btn {
      position: absolute; top: .85rem; right: .85rem;
      background: none; border: none; cursor: pointer; padding: .3rem;
      border-radius: 7px; color: var(--text-muted);
      transition: color .15s, background .15s; display: inline-flex;
    }
    .fav-btn:hover { color: var(--gold); background: rgba(255,209,102,.08); }
    .fav-btn.active { color: var(--gold); }
    .fav-btn svg { display: block; }
    .fav-btn svg polygon { fill: none; transition: fill .15s; }
    .fav-btn.active svg polygon { fill: currentColor; }

    /* ── Onglet Favoris : layout pleine largeur ── */
    .layout.no-sidebar { grid-template-columns: 1fr; }
    .layout.no-sidebar .sidebar { display: none; }

    .empty { color: var(--text-muted); text-align: center; padding: 3rem 1rem; font-size: .95rem; }
    .empty svg { display: block; margin: 0 auto 1rem; opacity: .35; }

    /* ── Disclaimer ── */
    .disclaimer {
      margin-top: 2rem; padding: .85rem 1.1rem; border: 1px solid var(--border);
      border-radius: 12px; color: var(--text-muted); font-size: .78rem; line-height: 1.5;
      display: flex; align-items: center; justify-content: center; text-align: center; gap: .6rem;
    }
    .disclaimer svg { flex-shrink: 0; color: var(--gold); }

    /* ── Onglets : icône SVG ── */
    .tab { display: inline-flex; align-items: center; gap: .45rem; }
    .tab svg { display: block; }
    footer { text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: .78rem; }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; display: flex; flex-wrap: wrap; gap: .4rem; }
      .sidebar button { width: auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="../index.html" class="back-link">← Retour au tableau de bord</a>

    <header>
      <div class="brand">
        <span class="pulse">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12h4l2 5 4-12 2 7h6"/>
          </svg>
        </span>
        <div>
          <h1>Med<span class="accent">Pulse</span></h1>
          <p>Veille médicale — actualités &amp; mises au point</p>
        </div>
      </div>
      <div class="cs-wrap" id="cs-specialite">
        <div class="cs-trigger" role="button" tabindex="0" aria-haspopup="listbox">
          <span class="cs-ico">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12h4l2 5 4-12 2 7h6"/>
            </svg>
          </span>
          <span class="cs-label">Chargement…</span>
          <span class="cs-chev">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </div>
        <ul class="cs-list" role="listbox" id="cs-list"></ul>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="etudes">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 17 7 11 12 14 16 7 21 10"/>
          <line x1="3" y1="3" x2="3" y2="20"/>
          <line x1="3" y1="20" x2="21" y2="20"/>
        </svg>
        Dernières études
      </button>
      <button class="tab" data-tab="mises_au_point">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
        Mises au point
      </button>
      <button class="tab" data-tab="favoris">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        Favoris
      </button>
    </div>

    <div class="layout">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="feed" id="feed"></main>
    </div>

    <div class="disclaimer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>Synthèses générées automatiquement à partir de sources publiques (PubMed, flux RSS).
      Vérifiez toujours l'article original via le lien fourni.</span>
    </div>
    <footer>MedPulse · HeavyMed Apps · &copy; 2026</footer>
  </div>

  <script>
    const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    const TYPE_LABEL = { 'etude':'Étude', 'meta-analyse':'Méta-analyse', 'synthese':'Synthèse', 'recommandation':'Recommandation' };

    let DATA = null;              // contenu de la spécialité courante
    let SPECIALITE_ID = null;     // identifiant pour le localStorage
    let currentTab = 'etudes';
    let currentFilter = null;     // mois (études) ou sous-thème (mises au point / favoris)

    // ── Gestion des favoris (localStorage) ─────────────────────────────────
    function loadFavs() {
      try { return JSON.parse(localStorage.getItem('medpulse_favs') || '{}'); }
      catch(e) { return {}; }
    }
    function saveFavs(favs) {
      try { localStorage.setItem('medpulse_favs', JSON.stringify(favs)); } catch(e) {}
    }
    function getFavsSet() {
      const all = loadFavs();
      return new Set(all[SPECIALITE_ID] || []);
    }
    function toggleFav(id) {
      const all = loadFavs();
      const set = new Set(all[SPECIALITE_ID] || []);
      if (set.has(id)) { set.delete(id); } else { set.add(id); }
      all[SPECIALITE_ID] = [...set];
      saveFavs(all);
    }

    function fmtDate(iso) {
      const d = new Date(iso + 'T00:00:00');
      return d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear();
    }
    function moisCle(iso) { return iso.slice(0, 7); } // "2026-05"
    function moisLabel(cle) {
      const [a, m] = cle.split('-');
      return MOIS[parseInt(m, 10) - 1].replace(/^./, c => c.toUpperCase()) + ' ' + a;
    }

    function items() {
      if (currentTab === 'favoris') {
        const favs = getFavsSet();
        const all = [...(DATA.etudes || []), ...(DATA.mises_au_point || [])];
        return all.filter(it => favs.has(it.id)).sort((x, y) => (y.date < x.date ? -1 : 1));
      }
      const arr = (DATA[currentTab] || []).slice();
      // tri : marquants d'abord, puis date décroissante
      arr.sort((x, y) => (y.marquant - x.marquant) || (y.date < x.date ? -1 : 1));
      return arr;
    }

    function buildSidebar() {
      const sb = document.getElementById('sidebar');
      sb.innerHTML = '';
      if (currentTab === 'favoris') return; // favoris = liste plate, pas de sidebar
      const groups = {};
      items().forEach(it => {
        const key = currentTab === 'etudes' ? moisCle(it.date) : it.sous_theme;
        (groups[key] = groups[key] || []).push(it);
      });
      let keys = Object.keys(groups);
      if (currentTab === 'etudes') keys.sort().reverse();      // mois récents en haut
      else keys.sort((a, b) => a.localeCompare(b, 'fr'));      // sous-thèmes alpha

      if (currentFilter === null || !groups[currentFilter]) currentFilter = keys[0] || null;

      keys.forEach(k => {
        const b = document.createElement('button');
        if (k === currentFilter) b.className = 'active';
        const label = currentTab === 'etudes' ? moisLabel(k) : k;
        b.innerHTML = '<span>' + label + '</span><span class="count">' + groups[k].length + '</span>';
        b.onclick = () => { currentFilter = k; render(); };
        sb.appendChild(b);
      });
    }

    function buildFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';

      // Onglet Favoris : liste plate sans filtre sidebar
      let list;
      if (currentTab === 'favoris') {
        list = items();
        if (!list.length) {
          feed.innerHTML =
            '<div class="empty">' +
            '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>' +
            '</svg>' +
            'Aucun favori pour l\'instant.<br>Cliquez sur l\'étoile d\'un article pour l\'enregistrer ici.</div>';
          return;
        }
      } else {
        list = items().filter(it =>
          currentTab === 'etudes' ? moisCle(it.date) === currentFilter : it.sous_theme === currentFilter
        );
        if (!list.length) { feed.innerHTML = '<div class="empty">Aucune entrée pour cette sélection.</div>'; return; }
      }

      const favs = getFavsSet();

      list.forEach(it => {
        const card = document.createElement('article');
        card.className = 'card' + (it.marquant ? ' marquant' : '');

        // Badge "À retenir" (icône drapeau)
        let html = '';
        if (it.marquant) {
          html += '<span class="flag">' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>' +
            '<line x1="4" y1="22" x2="4" y2="15"/>' +
            '</svg> À retenir</span>';
        }

        // Bouton favori (étoile)
        const isFav = favs.has(it.id);
        html += '<button class="fav-btn' + (isFav ? ' active' : '') + '" data-id="' + it.id + '" title="' + (isFav ? 'Retirer des favoris' : 'Ajouter aux favoris') + '" aria-label="Favori">' +
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>' +
          '</svg></button>';

        // Méta + contenu
        const showSubTheme = (currentTab === 'mises_au_point' || currentTab === 'favoris') && it.sous_theme;
        html += '<div class="card-meta">' +
          '<span class="badge type">' + (TYPE_LABEL[it.type] || it.type) + '</span>' +
          (it.journal ? '<span class="badge">' + it.journal + '</span>' : '') +
          '<span class="badge date">' + fmtDate(it.date) + '</span>' +
          (showSubTheme ? '<span class="badge">' + it.sous_theme + '</span>' : '') +
          '</div>';
        html += '<h3>' + it.titre + '</h3>';
        if (it.breve) html += '<p>' + it.breve + '</p>';
        html += '<a class="src" href="' + it.source_url + '" target="_blank" rel="noopener">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>' +
          '<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>' +
          '</svg>Lire l\'article (' + it.source_nom + ')</a>';

        card.innerHTML = html;

        // Gestion du clic sur le bouton favori
        card.querySelector('.fav-btn').addEventListener('click', function(e) {
          e.stopPropagation();
          const id = this.dataset.id;
          toggleFav(id);
          if (currentTab === 'favoris') {
            // En mode Favoris, re-rendu complet pour retirer la carte
            render();
          } else {
            // Sinon, juste mettre à jour le bouton
            const active = getFavsSet().has(id);
            this.classList.toggle('active', active);
            this.title = active ? 'Retirer des favoris' : 'Ajouter aux favoris';
          }
        });

        feed.appendChild(card);
      });
    }

    function render() {
      const layout = document.querySelector('.layout');
      layout.classList.toggle('no-sidebar', currentTab === 'favoris');
      buildSidebar();
      buildFeed();
    }

    document.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        currentTab = t.dataset.tab; currentFilter = null; render();
      };
    });

    async function loadSpecialite(fichier) {
      DATA = await (await fetch('data/' + fichier)).json();
      SPECIALITE_ID = fichier.replace('.json', '');
      currentFilter = null; render();
    }

    async function init() {
      try {
        const spec = await (await fetch('data/specialites.json')).json();
        const items = spec.specialites.filter(s => s.actif);
        const wrap    = document.getElementById('cs-specialite');
        const label   = wrap.querySelector('.cs-label');
        const list    = document.getElementById('cs-list');
        const trigger = wrap.querySelector('.cs-trigger');
        let currentFichier = items[0]?.fichier || null;
        if (items[0]) label.textContent = items[0].nom;
        items.forEach((s, i) => {
          const li = document.createElement('li');
          li.setAttribute('role', 'option');
          li.textContent = s.nom;
          if (i === 0) li.className = 'active';
          li.addEventListener('click', () => {
            wrap.querySelectorAll('li').forEach(x => x.classList.remove('active'));
            li.classList.add('active');
            label.textContent = s.nom;
            wrap.classList.remove('open');
            if (s.fichier !== currentFichier) {
              currentFichier = s.fichier;
              loadSpecialite(s.fichier);
            }
          });
          list.appendChild(li);
        });
        trigger.addEventListener('click', () => wrap.classList.toggle('open'));
        trigger.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); wrap.classList.toggle('open'); }
          if (e.key === 'Escape') wrap.classList.remove('open');
        });
        document.addEventListener('click', e => {
          if (!wrap.contains(e.target)) wrap.classList.remove('open');
        });
        if (currentFichier) await loadSpecialite(currentFichier);
      } catch (e) {
        document.getElementById('feed').innerHTML =
          '<div class="empty">Impossible de charger les données.<br>' +
          'Ouvrez le site via un serveur local plutôt qu\'en double-cliquant le fichier.</div>';
      }
    }
    init();
  </script>
</body>
</html>
